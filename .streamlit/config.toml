[server]
port = 3000
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "none"
enableWebsocketCompression = false
websocketPingInterval = 20
disconnectedSessionTTL = 3600
allowedHosts = ["*"]
corsAllowedOrigins = ["*"]

[browser]
gatherUsageStats = false
